<style>

*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:600 16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100dvh}

.mu{color:var(--mu);font-size:14px;font-weight:600}
.center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn{border:0;border-radius:18px;padding:15px 18px;font-size:18px;color:var(--ink);background:var(--sun);width:100%;transition:transform .12s}
.btn:active,.tile:active,.opt:active{transform:scale(.96)}
.btn.sec{background:var(--s2);color:var(--tx)}.btn.mint{background:var(--mint)}.btn.coral{background:var(--coral)}.btn.sky{background:var(--sky)}.btn.vio{background:var(--vio)}

.card.win{background:var(--sun);color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;border-radius:24px;padding:16px;text-align:left;color:var(--ink);min-height:136px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;transition:transform .12s}
.tile.wide{grid-column:span 2;min-height:150px}

.nota{background:var(--sun);color:var(--ink);border:3px dashed var(--ink);border-radius:14px;padding:8px 16px;display:flex;align-items:center;gap:10px;width:max-content;transform:rotate(-3deg)}

.opt{background:var(--s2);color:var(--tx);border:2px solid transparent;border-radius:18px;padding:14px 16px;text-align:left;font-size:16px;font-weight:700;width:100%;transition:transform .12s,border-color .12s}
.opt:active{border-color:var(--sun)}
input,textarea{width:100%;background:var(--s2);color:var(--tx);border:2px solid transparent;border-radius:14px;padding:14px;font:600 16px system-ui}
textarea{min-height:84px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.x,.back{border:0;background:var(--s2);color:var(--tx);border-radius:14px;min-width:48px;height:48px;font-size:18px}
.xbtn{align-self:flex-end;border:0;background:var(--s2);color:var(--tx);border-radius:14px;width:48px;height:48px;font-size:20px;font-weight:800;margin-bottom:-4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;display:inline-block;padding:7px 13px;border-radius:99px;background:var(--s2);color:var(--tx);font-size:14px;font-weight:800}
.chip.on{background:var(--mint);color:var(--ink)}
.top{display:flex;justify-content:space-between;gap:8px}
.status{border:0;border-radius:16px;padding:12px;font-size:14px;font-weight:800;background:var(--s1);color:var(--mu)}
.status.ok{color:var(--mint)}.status.off{color:var(--sun)}
.bar{height:30px;border-radius:10px;background:var(--s2);overflow:hidden}
.bar i{display:block;height:100%;width:0;transition:width .7s ease-out;display:flex;align-items:center;padding-left:10px;color:var(--ink);font-weight:800;font-size:14px}
.big{font-size:22px;font-weight:800;font-family:"Baloo 2",system-ui}
.pop{animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
.dice{font-size:60px;animation:spin 1s linear infinite}
.coin{position:fixed;top:-50px;z-index:9;pointer-events:none;animation:fall 2.2s linear forwards}
.score{display:flex;justify-content:space-between;font-weight:800}
@keyframes in{from{transform:translateY(10px)}}
@keyframes drop{from{transform:translateY(-70px) rotate(-14deg)}}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fall{to{transform:translateY(112vh) rotate(360deg)}}
#toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 20px);max-width:448px;margin:auto;background:var(--coral);color:var(--ink);border-radius:16px;padding:14px;font-weight:800;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cat{position:relative;border:3px solid transparent;border-radius:18px;background:var(--s2);color:var(--tx);padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px}.cat i{font-style:normal;font-size:34px;line-height:1}.cat span{font-size:13px;font-weight:800}.cat b{position:absolute;top:4px;right:6px;font-size:13px;color:var(--ink);background:var(--mint);border-radius:50%;width:20px;height:20px;line-height:20px;text-align:center}.cat.on{border-color:var(--mint);background:#2f2a66}.cat:active{transform:scale(.95)}

show(`
<header class="hd"><div class="logo">🎲</div><div><h1>GameBox</h1><p class="mu">Jogos pra galera, direto no celular.</p></div></header>
<button class="card row plr" style="border:0;color:var(--tx);text-align:left" data-a="players">${players.length?`<div class="avs">${players.map((n,i)=>`<span class="av" style="background:${pc[i%8]}">${esc((n[0]||'?').toUpperCase())}</span>`).join('')}</div><span style="flex:1;font-size:15px">${players.map(esc).join(', ')}</span>`:'<span style="font-size:26px">👥</span><span style="flex:1">Toque para adicionar os jogadores</span>'}<span class="mu">editar</span></button>
<div class="sec"><h3>🎉 Clássicos de festa</h3></div>
<div class="grid">
<button class="tile wide" style="background:var(--coral)" data-a="mode" data-m="vd"><div class="vdart"><div class="vc v"><i>🗣️</i><small>VERDADE</small></div><div class="vc d"><i>💪</i><small>DESAFIO</small></div></div><div><b>Verdade ou Desafio</b><br><span>Escolha e encare · 5 categorias 🔥</span></div></button>
<button class="tile wide" style="background:var(--sun)" data-a="mode" data-m="reais"><div class="nota drop"><b>20</b><small>R$<br>fictícios</small></div><div><b>Jogo dos 20 Reais</b><br><span>Leilão com R$ 20 fictícios: dê lances e leve os itens 💰</span></div></button>
${['vp','en','ia'].map(tl).join('')}
</div>
<div class="sec"><h3>🧠 Jogos completos</h3><span>10 jogos</span></div>
<div class="grid">${['mf','im','cs','la','sv','cp','cr','hi','nj','cq'].filter(k=>MODES[k]).map(tl).join('')}</div>
<div class="sec"><h3>💕 Para casais</h3><span>2 jogadores</span></div>
<div class="grid">${['qm','sy','cc','dt'].filter(k=>MODES[k]).map(tl).join('')}</div>`)}
function pscr(){cur='players';show(`<h2>Quem vai jogar? 👥</h2><p class="mu">De 2 a 8 pessoas. Os nomes ficam salvos só neste celular.</p>
${draft.map((n,i)=>`<div class="row"><input data-pi="${i}" value="${esc(n)}" maxlength="14" placeholder="Jogador ${i+1}" autocomplete="off">${draft.length>2?`<button class="x" data-a="pdel" data-i="${i}" aria-label="Remover jogador">✕</button>`:''}</div>`).join('')}
${draft.length<8?'<button class="btn sec" data-a="padd">+ Adicionar jogador</button>':''}
<button class="btn mint" data-a="pok">Pronto ✅</button><button class="btn sec" data-a="home">Voltar</button>`)}
function playersScreen(next){pending=next;draft=players.length?[...players]:['',''];pscr()}
function startMode(m){if(players.length<2)return playersScreen(m);({reais:reaisSetup,vd:todStart,vp:vpStart,en:enStart,ia:roleta})[m]()}
/* ---------- Jogo dos 20 Reais (leilão) ---------- */
let U={pack:'Misto',cnt:5};
function reaisSetup(){cur='rs';show(`${back()}<div class="nota drop"><b>20</b><small>R$<br>fictícios</small></div><h2>Jogo dos 20 Reais</h2>
<div class="card"><p>💵 Cada um começa com <b>R$ 20</b> <span class="mu">(fictícios, sem dinheiro real!)</span><br>⚽ Aparece um item, tipo uma bola de futebol.<br>🙋 Na sua vez, dê <b>qualquer lance de R$ 1 a R$ 20</b> (maior que o último) ou passe. Quem passa sai do item.<br>🔨 O último lance leva o item e paga.<br>🏁 No fim, vence quem tiver mais pontos: <b>valor dos itens + dinheiro que sobrou</b>.</p></div>
<div class="card"><h3>Modo de itens</h3><div class="chips">${Object.entries(PKI).map(([k,i])=>`<button class="chip ${k===U.pack?'on':''}" data-a="pack" data-k="${k}">${i} ${k}</button>`).join('')}</div>
<h3>Quantos itens?</h3><div class="chips">${[3,5,8].map(n=>`<button class="chip ${n===U.cnt?'on':''}" data-a="cnt" data-n="${n}">${n}</button>`).join('')}</div></div>
<div class="card"><h3>Jogadores</h3><p>${players.map(esc).join(' • ')}</p><button class="btn sec" data-a="players2">Editar jogadores</button></div>
<button class="btn" data-a="reaisgo">Começar leilão 🚀</button>`)}
function reaisGo(){const {pack,cnt}=U;U={pack,cnt,money:Object.fromEntries(players.map(p=>[p,20])),own:Object.fromEntries(players.map(p=>[p,[]])),q:shuf(PK[pack].it).slice(0,cnt).map(mkItem),n:0};nextItem()}
function nextItem(){if(U.n>=U.q.length)return fim();U.item=U.q[U.n];U.n++;U.bid=0;U.leader=null;U.out=new Set();auction((U.n-1)%players.length)}
const minBid=()=>U.leader===null?1:U.bid+1;
function pickTurn(st){for(let k=0;k<players.length;k++){const i=(st+k)%players.length;if(i===U.leader||U.out.has(i))continue;if(U.money[players[i]]<minBid()){U.out.add(i);continue}return i}return -1}
function auction(st){const t=pickTurn(st);if(t<0)return endItem();U.cur=t;cur='auc';
 const p=players[t],m=U.money[p],mb=minBid(),opts=[...new Set([mb,mb+2,mb+5,m])].filter(v=>v>=mb&&v<=m);
 show(`<div class="top"><span class="chip">Item ${U.n}/${U.q.length}</span><span class="chip on" style="background:var(--sun)">vale ${U.item.v} pts</span></div>
 <div class="card center"><div style="font-size:64px;line-height:1">${U.item.ic}</div><h2>${esc(U.item.n)}</h2><p>${U.leader===null?'Sem lances ainda':`Maior lance: <b>R$ ${U.bid}</b> de ${esc(players[U.leader])}`}</p></div>
 <div class="chips">${players.map((n,i)=>`<span class="chip ${i===t?'on':''}">${esc(n)} · R$ ${U.money[n]}${U.out.has(i)?' ✋':''}${U.own[n].map(o=>o.ic).join('')}</span>`).join('')}</div>
 <p>👉 Vez de <b>${esc(p)}</b>, você tem R$ ${m}. Lance de R$ ${mb} a R$ ${m}:</p>
 <div class="grid">${opts.map((v,k)=>`<button class="btn ${['','mint','sky','vio'][k%4]}" data-a="bid" data-v="${v}">${v===m&&v>mb?'Tudo: ':''}R$ ${v}</button>`).join('')}</div>
 <div class="row"><input id="bidv" type="number" inputmode="numeric" min="${mb}" max="${m}" placeholder="Outro valor"><button class="btn" style="width:auto;white-space:nowrap" data-a="bidc">Dar lance 🔨</button></div>
 <button class="btn sec" data-a="pass">✋ Passar</button>`)}
function endItem(){cur='aend';const l=U.leader;let top;
 if(l===null)top=`<div class="center"><div style="font-size:64px">${U.item.ic}</div><h2>😴 Ninguém quis!</h2><p class="mu">O item ficou sem dono.</p></div>`;
 else{const w=players[l];U.money[w]-=U.bid;U.own[w].push(U.item);top=`<div class="center"><div style="font-size:64px">${U.item.ic}</div><h1 class="pop">${esc(w)}</h1><p>levou ${esc(U.item.n)} por <b>R$ ${U.bid}</b> 🔨</p></div>`}
 show(top+`<div class="card"><h3>Dinheiro 💵</h3>${players.map(n=>`<div class="score"><span>${esc(n)} ${U.own[n].map(o=>o.ic).join('')}</span><span>R$ ${U.money[n]}</span></div>`).join('')}</div><button class="btn" data-a="anext">${U.n>=U.q.length?'Ver resultado 🏁':'Próximo item ➡️'}</button>`);if(l!==null)rain()}
function fim(){cur='fim';const r=players.map(n=>({n,it:U.own[n].reduce((a,o)=>a+o.v,0),m:U.money[n]})).map(x=>({...x,t:x.it+x.m})).sort((a,b)=>b.t-a.t),top=r.filter(x=>x.t===r[0].t);
 show(`<div class="center"><div class="nota drop"><b>${r[0].t}</b><small>pontos</small></div><h1 class="pop">${top.length>1?'🤝 Empate!':'🏆 '+esc(r[0].n)}</h1>${top.length>1?`<p>${top.map(x=>esc(x.n)).join(' e ')} empataram!</p>`:''}</div>
 <div class="card"><h3>Placar final</h3>${r.map(x=>`<p><b>${esc(x.n)}</b>: ${x.t} pts<br><span class="mu">itens ${x.it} (${U.own[x.n].map(o=>o.ic).join('')||'nenhum'}) + sobrou R$ ${x.m}</span></p>`).join('')}</div>
 <button class="btn" data-a="reaisgo">Jogar de novo 🔄</button><button class="btn sec" data-a="reaisSetup">Trocar modo de itens</button><button class="btn sec" data-a="home">Menu</button>`);rain()}

/* ---------- Verdade ou Desafio ---------- */
let T;const VDI={Leve:'😊','Engraçado':'😂',Confissões:'🤫',Ousado:'🌶️',Safadinho:'😈'};
function todStart(){T={sel:new Set(['Leve']),i:0,card:null,pick:{}};Object.entries(VD).forEach(([k,v])=>T.pick[k]={v:deck(v.v),d:deck(v.d)});tod()}
function tod(){cur='tod';const p=players[T.i%players.length];show(`${back()}<h2>🔥 Verdade ou Desafio</h2>
<div class="chips"><p class="mu">Toque para escolher uma ou mais categorias 👇</p><div class="cats">${Object.keys(VD).map(k=>`<button class="cat ${T.sel.has(k)?'on':''}" data-a="tcat" data-k="${k}"><i>${VDI[k]}</i><span>${k}</span>${T.sel.has(k)?'<b>✓</b>':''}</button>`).join('')}</div></div>
<div class="center"><p class="mu">Vez de</p><h1 class="pop">${esc(p)}</h1></div>
${T.card?`<div class="card pop"><span class="chip" style="align-self:flex-start">${T.card.k}</span><h3>${esc(T.card.t)}</h3></div><button class="btn mint" data-a="tnext">Feito! Próximo jogador ➡️</button><button class="btn sec" data-a="tskip">Prefiro pular 🙅</button>`
:`<button class="btn coral" data-a="tdraw" data-k="v">🗣️ Verdade</button><button class="btn sky" data-a="tdraw" data-k="d">💪 Desafio</button>`}`)}

/* ---------- Você prefere? ---------- */
let P;
function vpStart(){P={q:deck(VP)};vpNew()}
function vpNew(){P.cur=P.q();P.votes=[];P.i=0;vp()}
function vp(){cur='vp';const [a,b]=P.cur;
 if(P.i>=players.length){const na=P.votes.filter(v=>v===0).length,pa=Math.round(na/players.length*100);
  return show(`${back()}<h2>⚖️ Resultado</h2>${[[a,pa,'var(--coral)',0],[b,100-pa,'var(--sky)',1]].map(([t,p,c,k])=>`<div class="card"><b>${esc(t)}</b><div class="bar"><i style="background:${c}" data-w="${p}">${p}%</i></div><p class="mu">${players.filter((_,j)=>P.votes[j]===k).map(esc).join(', ')||'ninguém'}</p></div>`).join('')}<button class="btn" data-a="vpnext">Próxima pergunta ➡️</button>`),
  requestAnimationFrame(()=>document.querySelectorAll('.bar i').forEach(i=>i.style.width=Math.max(+i.dataset.w,12)+'%'))}
 show(`${back()}<h2>⚖️ Você prefere?</h2><p>🔒 Vez de <b>${esc(players[P.i])}</b> — vote sem os outros verem!</p><button class="btn coral" data-a="vote" data-v="0">${esc(a)}</button><p class="center mu">ou</p><button class="btn sky" data-a="vote" data-v="1">${esc(b)}</button>`)}

/* ---------- Eu nunca ---------- */
let N,adult=false;
function gateScr(to){cur='gate';show(`<div class="center" style="padding-top:14vh"><div style="font-size:64px">😈</div><h2>Modo Safadinho</h2></div><div class="card"><p>Conteúdo mais ousado, <b>só para maiores de 18 anos</b> que toparam jogar. Nada explícito, mas é pesadinho!<br>Ninguém é obrigado a responder: pode pular sem drama. 💜</p></div><button class="btn coral" data-a="gate" data-to="${to}">Tenho 18+ e topo 😈</button><button class="btn sec" data-a="${to==='vd'?'tback':'eback'}">Voltar</button>`)}
function enStart(){N={cat:'Leve',pick:{},tally:Object.fromEntries(players.map(p=>[p,0]))};Object.entries(ENC).forEach(([k,v])=>N.pick[k]=deck(v));enNew()}
function enNew(){N.cur=N.pick[N.cat]();N.did=new Set();en()}
function en(){cur='en';show(`${back()}<h2>🙈 Eu nunca</h2>
<div class="chips">${Object.keys(ENC).map(k=>`<button class="chip ${k===N.cat?'on':''}" data-a="ecat" data-k="${k}">${k==='Safadinho'?'😈 ':''}${k}</button>`).join('')}</div>
<div class="card pop"><h3>Eu nunca ${esc(N.cur)}</h3></div>
<p class="mu">Quem já fez, toque no próprio nome. Cada “já fiz” vale 1 ponto de vergonha 😅</p>
<div class="chips">${players.map((p,i)=>`<button class="chip ${N.did.has(i)?'on':''}" style="font-size:16px;padding:10px 16px" data-a="did" data-i="${i}">${esc(p)}</button>`).join('')}</div>
<button class="btn vio" data-a="ennext">Próxima frase ➡️</button>
<div class="card"><h3>Pontos de vergonha</h3>${Object.entries(N.tally).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<div class="score"><span>${esc(n)}</span><span>${v}</span></div>`).join('')}</div>`)}

/* ---------- Roleta da decisão ---------- */
let DX={opts:['','']};
function roleta(){cur='dec';show(`${back()}<h2>🎡 Roleta da decisão</h2><p class="mu">Escreva as opções e a roleta sorteia uma. É sorte pura, sem IA.</p>
${DX.opts.map((o,i)=>`<input data-di="${i}" value="${esc(o)}" maxlength="80" placeholder="Opção ${i+1}" autocomplete="off">`).join('')}
${DX.opts.length<8?'<button class="btn sec" data-a="dadd">+ Opção</button>':''}<button class="btn" data-a="spin">Girar 🎡</button>`)}
function spin(){const ops=DX.opts.map(o=>o.trim()).filter(Boolean);if(ops.length<2)return toast('Coloque pelo menos 2 opções.');cur='spin';const win=ops[Math.floor(Math.random()*ops.length)];
 show(`<div class="center" style="padding-top:25vh"><p class="mu">Sorteando…</p><h1 id="sp">🎡</h1></div>`);const el=document.querySelector('#sp');let n=0;
 const t=setInterval(()=>{n++;el.textContent=ops[n%ops.length];if(n>=18){clearInterval(t);
  show(`<div class="center" style="padding-top:18vh"><p class="mu">A roleta escolheu</p><h1 class="pop">🎯 ${esc(win)}</h1></div><button class="btn" data-a="spin">Girar de novo 🔄</button><button class="btn sec" data-a="dedit">Mudar opções</button><button class="btn sec" data-a="home">Menu</button>`);rain()}},100)}

/* ---------- Ações ---------- */
const A={
 home,exit:()=>{if(['auc','aend'].includes(cur)&&!confirm('Sair do jogo? A partida atual vai ser perdida.'))return;home()},players:()=>playersScreen(null),players2:()=>playersScreen('reais'),mode:d=>startMode(d.m),
 padd:()=>{draft.push('');pscr()},pdel:d=>{draft.splice(+d.i,1);pscr()},
 pok:()=>{const n=draft.map(x=>x.trim()).filter(Boolean);
  if(n.length<2)return toast('Coloque pelo menos 2 nomes.');
  if(new Set(n.map(x=>x.toLowerCase())).size!==n.length)return toast('Tem nomes repetidos.');
  players=n;save();pending?startMode(pending):home()},
 reaisgo:reaisGo,bid:d=>{U.bid=+d.v;U.leader=U.cur;auction((U.cur+1)%players.length)},pass:()=>{U.out.add(U.cur);auction((U.cur+1)%players.length)},anext:nextItem,
 tcat:d=>{if(T.sel.has(d.k)){if(T.sel.size>1)T.sel.delete(d.k);else toast('Deixe pelo menos 1 categoria.')}else{if(d.k==='Safadinho'&&!adult)return gateScr('vd');T.sel.add(d.k)}T.card=null;tod()},ecat:d=>{if(d.k==='Safadinho'&&!adult)return gateScr('en');N.cat=d.k;enNew()},gate:d=>{adult=true;if(d.to==='vd'){T.sel.add('Safadinho');T.card=null;tod()}else{N.cat='Safadinho';enNew()}},tback:()=>tod(),eback:()=>en(),
 bidc:()=>{const v=+document.querySelector('#bidv').value,mx=U.money[players[U.cur]],mb=minBid();if(!Number.isInteger(v)||v<mb||v>mx)return toast(`Dê um lance inteiro de R$ ${mb} a R$ ${mx}.`);A.bid({v})},pack:d=>{U.pack=d.k;reaisSetup()},cnt:d=>{U.cnt=+d.n;reaisSetup()},reaisSetup,

 tdraw:d=>{const c=pk([...T.sel]);T.card={k:`${VDI[c]} ${d.k==='v'?'Verdade':'Desafio'} · ${c}`,t:T.pick[c][d.k]()};tod()},
 tnext:()=>{T.i++;T.card=null;tod()},tskip:()=>{T.card=null;tod()},
 vote:d=>{P.votes[P.i]=+d.v;P.i++;vp()},vpnext:vpNew,
 did:d=>{const i=+d.i;N.did.has(i)?N.did.delete(i):N.did.add(i);en()},
 ennext:()=>{N.did.forEach(i=>N.tally[players[i]]++);enNew()},
 dadd:()=>{DX.opts.push('');roleta()},spin,dedit:roleta};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)A[b.dataset.a]?.(b.dataset)});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.pi!=null)draft[+t.dataset.pi]=t.value;
 if(t.dataset.di!=null)DX.opts[+t.dataset.di]=t.value;
 if(t.id==='dsit')DX.sit=t.value});
home();
</script>
<style>
.cb,.cq,.bd{display:grid;gap:4px}.cb{grid-template-columns:repeat(5,1fr)}.cq{grid-template-columns:repeat(7,1fr)}.bd{grid-template-columns:repeat(6,1fr)}
.cell{border:0;border-radius:9px;min-height:50px;padding:2px;font-weight:800;font-size:11px;line-height:1.1;color:var(--tx);background:var(--s2);word-break:break-word;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.cq .cell{aspect-ratio:1;min-height:0;font-size:14px}.cell.sel{box-shadow:0 0 0 3px var(--tx)}
.kR{background:var(--coral);color:var(--ink)}.kB{background:var(--sky);color:var(--ink)}.kN{background:#cfc8f0;color:var(--ink)}.kX{background:#000;color:#fff}.cell.dn{opacity:.6}
.bd .cell{aspect-ratio:1;min-height:0;font-size:10px;gap:1px}.dot{display:inline-block;border-radius:50%;width:15px;height:15px;color:var(--ink);font-size:9px;line-height:15px}
.opt.lock{opacity:.4}
</style>
<script>
/* ===== GameBox: novos modos ===== */
window.addEventListener('error',e=>{try{cur='err';app.innerHTML='<div class="scr"><div class="center" style="padding-top:14vh"><div style="font-size:56px">😵</div><h2>Ops, algo deu errado</h2><p class="mu">'+esc(e.message)+'</p></div><button class="btn" data-a="home">Voltar ao menu</button></div>'}catch{}});
const GF={};let G={};
const PC=['#FF5D73','#4CC9F0','#38E0A1','#FFC93C','#A66BFF','#FF9F5A','#F4F1FF','#F78FB3'];
const pk=a=>a[Math.floor(Math.random()*a.length)],nm=i=>esc(players[i]);
const sc=h=>{cur='g_';show(h)};
const bt=(l,f,v='',c='')=>`<button class="btn ${c}" data-a="g" data-f="${f}" data-v="${esc(v)}">${l}</button>`;
const ob=(l,f,v)=>`<button class="opt" data-a="g" data-f="${f}" data-v="${esc(v)}">${l}</button>`;
const fin=(h,m)=>{cur='g_x';show(h+bt('Jogar de novo 🔄','again',m)+'<button class="btn sec" data-a="home">Menu</button>');rain()};
const need=(n,m)=>{if(players.length>=n)return 0;toast(`Esse modo precisa de ${n}+ jogadores.`);playersScreen(m);return 1};
const tl=c=>`<div class="card">${Object.entries(c).map(([i,n])=>`<div class="score"><span>${nm(i)}</span><span>${n} voto(s)</span></div>`).join('')||'<p class="mu">Ninguém votou.</p>'}</div>`;
const fx=(s,o)=>{(s||'').replace(/([fwhm])(-?\d+)/g,(_,k,v)=>{o[k]=Math.max(0,Math.min(10,o[k]+ +v))})};
A.g=d=>GF[d.f](d.v);GF.again=m=>startMode(m);
let _xh='',_xc='';A.exit=()=>{if(['g_','auc','aend'].includes(cur)){_xh=app.innerHTML;_xc=cur;cur='g_c';app.innerHTML='<div class="scr"><div class="center" style="padding-top:18vh"><div style="font-size:56px">🚪</div><h2>Sair do jogo?</h2><p class="mu">A partida atual vai ser perdida.</p></div><button class="btn mint" data-a="xno">Continuar jogando</button><button class="btn coral" data-a="home">Sair</button></div>';scrollTo(0,0);return}home()};A.xno=()=>{app.innerHTML=_xh;cur=_xc};

/* revelação secreta: passe o celular */
GF.rv=()=>{const r=G.rv;sc(`<div class="center" style="padding-top:12vh"><p class="mu">📱 Passe o celular para</p><h1 class="pop">${nm(r.i)}</h1><p class="mu">Os outros não devem olhar!</p></div>${bt('Sou eu, mostrar 👀','rv2')}`)};
GF.rv2=()=>{const r=G.rv;sc(`<h2>${nm(r.i)}</h2>${r.h}${r.next?bt('Entendi, esconder 🙈','rvn','','sec'):''}`)};
GF.rvn=()=>G.rv.next();
const reveal=(i,h,next)=>{G.rv={i,h,next};GF.rv()};

/* votação secreta (reuso) */
function vote(L,done){G.vl=L;G.vs=[];G.vk=0;G.vd=done;vn()}
function vn(){if(G.vk>=G.vl.length){const c={};G.vs.forEach(j=>{if(j>=0)c[j]=(c[j]||0)+1});const mx=Math.max(0,...Object.values(c)),top=Object.keys(c).filter(k=>c[k]===mx);return G.vd(mx>0&&top.length===1?+top[0]:-1,c)}
 const i=G.vl[G.vk++];reveal(i,`<p>🗳️ Quem você quer eliminar?</p>`+G.vl.filter(j=>j!==i).map(j=>ob(nm(j),'vt',j)).join('')+ob('🤷 Abster-se','vt',-1),null)}
GF.vt=v=>{G.vs.push(+v);vn()};

/* ---------- 1. MÁFIA ---------- */

function mfStart(){if(need(4,'mf'))return;const n=players.length;let r=['D',...Array(n>=6?2:1).fill('M')];if(n>=5)r.push('T');while(r.length<n)r.push('C');G={g:'mf',r:shuf(r),a:players.map(()=>1),d:0};mfR(0)}
function mfR(i){if(i>=players.length)return mfNight();const r=G.r[i],[ic,n,d]=MR[r],par=r==='M'?G.r.map((x,j)=>x==='M'&&j!==i?nm(j):'').join(''):'';
 reveal(i,`<div class="card center"><div style="font-size:60px">${ic}</div><h2>${n}</h2><p>${d}</p>${par?`<p>Seu parceiro: <b>${par}</b></p>`:''}</div>`,()=>mfR(i+1))}

function mfTurn(){if(G.qi>=G.q.length)return mfDawn();const i=G.q[G.qi],r=G.r[i],al=mfAl();let h=`<p class="mu">🌙 Noite ${G.d}</p>`;
 if(r==='M')h+=`<p>🔪 Escolha a vítima:</p>`+al.filter(j=>G.r[j]!=='M').map(j=>ob(nm(j),'mfa',j)).join('');
 else if(r==='D')h+=`<p>💉 Quem você protege?</p>`+al.map(j=>ob(nm(j)+(j===i?' (você)':''),'mfa',j)).join('');
 else if(r==='T')h+=`<p>🕵️ Quem você investiga?</p>`+al.filter(j=>j!==i).map(j=>ob(nm(j),'mft',j)).join('');
 else h+=`<p>😴 Você não tem poder à noite. Finja que está pensando e toque para dormir.</p>`+ob('Dormir','mfa',-1);
 reveal(i,h,null)}
GF.mfa=j=>{const r=G.r[G.q[G.qi]];if(r==='M')G.k.push(+j);if(r==='D')G.s=+j;G.qi++;mfTurn()};
GF.mft=j=>{sc(`<h2>🕵️ Resultado</h2><div class="card center"><h3>${nm(+j)}</h3><p class="big">${G.r[+j]==='M'?'É da MÁFIA 🔪':'É inocente 😇'}</p></div>`+bt('Entendi, esconder 🙈','mfx'))};

function mfWin(){const m=mfAl().filter(i=>G.r[i]==='M').length,o=mfAl().length-m;if(m>0&&m<o)return 0;
 fin(`<div class="center"><h1 class="pop">${m?'🔪 A Máfia vence!':'🎉 A Vila vence!'}</h1></div><div class="card"><h3>Papéis</h3>${G.r.map((r,i)=>`<div class="score"><span>${nm(i)}${G.a[i]?'':' 💀'}</span><span>${MR[r][0]} ${MR[r][1]}</span></div>`).join('')}</div>`,'mf');return 1}
function mfDawn(){const v=G.k.length?pk(G.k):-1;let m;
 if(v<0)m='Ninguém foi atacado.';else if(v===G.s)m=`🔪 Atacaram ${nm(v)}, mas o médico salvou! 💉`;
 else{G.a[v]=0;m=`💀 <b>${nm(v)}</b> foi eliminado(a) na noite. Era ${MR[G.r[v]][1]} ${MR[G.r[v]][0]}.`}

 if(r===G.imp)return reveal(G.imp,`<p>Você foi pego! Última chance: qual era a palavra secreta?</p>`+shuf(G.ws).map(w=>ob(w,'img',w)).join(''),null);
 if(imAl().length<=2)return imEnd(1,`${nm(r)} era inocente e o impostor sobreviveu.`);
 G.rd++;sc(`<h2>😬 Era inocente!</h2><p><b>${nm(r)}</b> não era o impostor.</p>${tl(c)}`+bt('Nova rodada ➡️','imh'))});

const csKey=()=>`<p class="mu">🔴 vermelho · 🔵 azul · cinza neutro · ⚫ assassino</p><div class="cb">${G.w.map((w,i)=>`<div class="cell k${G.k[i]}${G.v[i]?' dn':''}">${w}</div>`).join('')}</div>`;

 ${G.cl?`<div class="card center"><p class="mu">Pista</p><h2>${esc(G.cl.t)} · ${G.cl.n}</h2><p class="mu">Palpites restantes: ${G.L}</p></div>`:`<div class="card"><p>Espião <b>${nm(sp)}</b>, dê a pista:</p><input id="cl" maxlength="20" placeholder="Pista (uma palavra)" autocomplete="off"><input id="cn" type="number" inputmode="numeric" min="1" max="9" placeholder="Quantas palavras?"><button class="btn" data-a="g" data-f="csc">Confirmar pista</button></div>`}
 <div class="cb">${G.w.map((w,i)=>G.v[i]?`<div class="cell k${G.k[i]}">${w}</div>`:`<button class="cell" ${G.cl?`data-a="g" data-f="csg" data-v="${i}"`:''}>${w}</button>`).join('')}</div>
 ${G.cl?bt('Encerrar a vez ⏭️','css','','sec'):''}<button class="btn sec" data-a="g" data-f="csv">🔑 Espião: ver chave</button>`)}

GF.csc=()=>{const t=document.querySelector('#cl').value.trim(),n=+document.querySelector('#cn').value;if(!t||!Number.isInteger(n)||n<1||n>9)return toast('Escreva a pista e um número de 1 a 9.');G.cl={t,n};G.L=n+1;csTurn()};

GF.css=csSw;

 if(ty==='X')return csEnd(csOth(G.t),'⚫ Pegaram o assassino!');
 if(ty===G.t){G.L--;if(!csRem(G.t))return csEnd(G.t,'Acharam todas as palavras!');return G.L<=0?(toast('Acabaram os palpites!'),csSw()):csTurn()}

 if(mx<=0)r='😴 Ninguém quis o item.';else{const w=pk(players.map((_,i)=>i).filter(i=>G.b[i]===mx)),pr=G.val-mx;G.m[w]-=mx;G.v[w]+=G.val;r=`🔨 <b>${nm(w)}</b> levou por R$ ${mx}!<br>Valor real: <b>R$ ${G.val}</b> → ${pr>=0?`lucro de R$ ${pr} 🤑`:`prejuízo de R$ ${-pr} 😭`}`}

 if(p.po>0){p.po--;p.hp-=2;G.pre='☠️ O veneno tirou 2 de vida.';if(p.hp<=0){p.x=1;if(cpWin())return;return sc(`<div class="center"><h1>💀 ${nm(i)}</h1><p>caiu envenenado(a)!</p></div>`+bt('Próximo ➡️','cpn'))}}
 if(p.fz){p.fz=0;return sc(`<div class="center"><h1>🧊 ${nm(i)}</h1><p>está congelado(a) e perde a vez!</p></div>${bt('Próximo ➡️','cpn')}`)}
 reveal(i,`${G.pre?`<p>${G.pre}</p>`:''}${cpBd()}<h3>Sua mão</h3>`+p.h.map((c,k)=>ob(`${CPT[c][0]} <b>${CPT[c][1]}</b><br><span class="mu">${CPT[c][2]}</span>`,'cpp',k)).join('')+ob('🔁 Descartar uma carta aleatória e passar','cpx',0),null)}

GF.cpp=k=>{k=+k;G.k=k;const c=G.p[G.i].h[k];if(!CPT[c][3])return cpPlay(k,-1);sc(`<h2>${CPT[c][0]} ${CPT[c][1]}</h2><p>Escolha o alvo:</p>`+cpAl().filter(j=>j!==G.i).map(j=>ob(`${nm(j)} · ${cpSt(j)}`,'cpt',j)).join(''))};
GF.cpt=j=>cpPlay(G.k,+j);
GF.cpx=()=>{const p=G.p[G.i],c=p.h.splice(Math.floor(Math.random()*p.h.length),1)[0];p.h.push(cpDraw());cpRes([`${nm(G.i)} descartou ${CPT[c][0]} ${CPT[c][1]} e comprou outra.`])};
function dmg(t,a,s,L){const T=G.p[t];if(T.mi&&s>=0){T.mi=0;L.push(`🪞 ${nm(t)} refletiu o ataque!`);return dmg(s,a,-1,L)}if(T.sh){T.sh=0;L.push(`🛡️ ${nm(t)} bloqueou o dano!`);return}T.hp-=a;L.push(`💢 ${nm(t)} sofreu ${a} de dano.`)}
function cpPlay(k,t){const i=G.i,p=G.p[i],c=p.h.splice(k,1)[0],L=[`${CPT[c][0]} <b>${nm(i)}</b> usou <b>${CPT[c][1]}</b>${t>=0?' em '+nm(t):''}.`],m=p.db&&['atk','big','heal'].includes(c)?(p.db=0,2):1;
 if(c==='atk')dmg(t,4*m,i,L);
 if(c==='big'){dmg(t,7*m,i,L);p.hp-=2;L.push(`${nm(i)} sofreu 2 de recuo.`)}
 if(c==='shd')p.sh=1;if(c==='mir')p.mi=1;if(c==='dbl'){p.db=1;L.push('✨ A próxima carta vale o dobro!')}
 if(c==='heal'){p.hp=Math.min(20,p.hp+5*m);L.push(`💚 Vida: ${p.hp}`)}
 if(c==='poi')G.p[t].po=3;if(c==='frz')G.p[t].fz=1;
 if(c==='stl'){const T=G.p[t];if(T.h.length){const s=T.h.splice(Math.floor(Math.random()*T.h.length),1)[0];p.h.push(s);L.push(`Roubou ${CPT[s][0]} ${CPT[s][1]}!`)}else L.push('Mas não havia cartas.')}
 if(c==='swp'){[p.hp,G.p[t].hp]=[G.p[t].hp,p.hp];L.push(`🔄 Vidas trocadas: ${nm(i)} ${p.hp}, ${nm(t)} ${G.p[t].hp}.`)}
 while(p.h.length<4)p.h.push(cpDraw());cpRes(L)}
function cpRes(L){players.forEach((_,j)=>{if(G.p[j].hp<=0&&!G.p[j].x){G.p[j].x=1;L.push(`💀 ${nm(j)} foi eliminado(a)!`)}});const p=G.p[G.i];while(p.h.length<4)p.h.push(cpDraw());

const CQP=[[0,0],[6,6],[0,6],[6,0],[0,3],[6,3],[3,0],[3,6]],CQR=15;
const adj=(a,b)=>Math.abs((a/7|0)-(b/7|0))+Math.abs(a%7-b%7)===1;
function cqStart(){const T=Array.from({length:49},()=>({o:-1,t:Math.random()<.5?1:0,c:0})),cs=[];players.forEach((_,p)=>{const id=CQP[p][0]*7+CQP[p][1];T[id]={o:p,t:3,c:1};cs.push(id)});G={g:'cq',T,cs,gold:players.map(()=>4),a:players.map(()=>1),p:0,mv:3,s:-1,r:1};cqTurn()}
const cqCnt=p=>G.T.filter(t=>t.o===p).length;
function cqTurn(msg){const p=G.p;sc(`<div class="top"><span class="chip on" style="background:${PC[p]}">${nm(p)}</span><span class="chip">Rodada ${G.r}/${CQR}</span><span class="chip">💰${G.gold[p]} · ⚡${G.mv}</span></div>${msg?`<p class="mu">${msg}</p>`:''}
 <div class="cq">${G.T.map((t,i)=>`<button class="cell ${G.s===i?'sel':''}" style="background:${t.o>=0?PC[t.o]:'var(--s2)'};color:${t.o>=0?'var(--ink)':'var(--mu)'}" data-a="g" data-f="cqt" data-v="${i}">${t.c?'🏰':''}${t.t||(t.o>=0?'0':'')}</button>`).join('')}</div>
 <p class="mu">Toque num território seu para selecionar; toque num vizinho para mover/atacar com todas as tropas menos 1. Castelo defende com +2. Cada ação gasta ⚡.</p>
 ${bt('Recrutar +1 ⚔️ (2💰)','cqr')}${bt('Encerrar turno ➡️','cqe','','mint')}<div class="chips">${players.map((n,i)=>`<span class="chip" style="${G.a[i]?'':'opacity:.4'}"><span class="dot" style="background:${PC[i]}"></span> ${esc(n)}: ${cqCnt(i)} terr. · 💰${G.gold[i]}</span>`).join('')}</div>`)}
GF.cqt=i=>{i=+i;const T=G.T,t=T[i],p=G.p,s=G.s;
 if(s>=0&&s!==i&&adj(s,i)&&T[s].t>=2&&G.mv>0){const src=T[s],send=src.t-1;let m;
  if(t.o===p){t.t+=send;src.t=1;m='Tropas movidas.'}
  else{const def=t.t+(t.c?2:0),prev=t.o,wc=t.c;src.t=1;
   if(send>def){t.o=p;t.t=send-def;m='🏴 Território conquistado!';if(wc&&prev>=0){G.a[prev]=0;T.forEach(x=>{if(x.o===prev&&!x.c)x.o=-1});m=`🏰 Castelo de ${nm(prev)} conquistado!`;if(G.a.filter(Boolean).length===1)return cqEnd('Último reino de pé!')}}
   else{t.t=Math.max(0,t.t-send);m='🛡️ Ataque repelido!'}}
  G.mv--;G.s=t.o===p&&t.t>=2?i:-1;return cqTurn(m)}
 if(t.o===p){G.s=i;return cqTurn()}
 toast('Selecione um território seu e toque num vizinho.')};
GF.cqr=()=>{const t=G.T[G.s];if(G.s<0||t.o!==G.p)return toast('Selecione um território seu.');if(G.gold[G.p]<2)return toast('Sem ouro (precisa de 2).');if(G.mv<=0)return toast('Sem ações (⚡).');t.t++;G.gold[G.p]-=2;G.mv--;cqTurn('Recrutou +1 tropa.')};
GF.cqe=()=>{const n=players.length;let q=G.p;do{q=(q+1)%n}while(!G.a[q]);if(q<=G.p)G.r++;
 if(G.r>CQR){const sc_=players.map((_,i)=>({i,v:cqCnt(i)*100+G.T.filter(t=>t.o===i).reduce((a,t)=>a+t.t,0)})).sort((a,b)=>b.v-a.v);return cqEnd(`Fim das ${CQR} rodadas: mais territórios vence!`,sc_[0].i)}
 G.p=q;G.mv=3;G.s=-1;const c=G.cs[q],own=G.T[c].o===q;if(own)G.T[c].t++;const inc=1+Math.floor(cqCnt(q)/3)+(own?1:0);G.gold[q]+=inc;cqTurn(`Renda de ${nm(q)}: +${inc}💰${own?' e +1 tropa no castelo':''}.`)};
function cqEnd(m,w){if(w==null)w=G.a.findIndex(Boolean);fin(`<div class="center"><h1 class="pop">👑 ${nm(w)}</h1><p>${m}</p></div><div class="card"><h3>Territórios</h3>${players.map((n,i)=>`<div class="score"><span>${esc(n)}${G.a[i]?'':' 💀'}</span><span>${cqCnt(i)}</span></div>`).join('')}</div>`,'cq')}

/* ---------- MODOS DE CASAL (2 jogadores) ---------- */
const cj=()=>players.length>2?`<p class="mu">💕 Jogam ${nm(0)} e ${nm(1)} (os 2 primeiros da lista).</p>`:'';
const scb=a=>`<div class="card">${[0,1].map(i=>`<div class="score"><span>${nm(i)}</span><span>${a[i]}</span></div>`).join('')}</div>`;
/* Quanto você me conhece? */
const QMQ=[['Como eu prefiro passar uma folga?',['Dormindo em casa','Saindo com amigos','Viajando','Maratona de série']],['Qual é o meu maior medo bobo?',['Baratas','Altura','Ficar sem bateria','Falar em público']],['Num jantar, eu peço:',['Pizza','Massa','Carne','Sobremesa primeiro']],['Meu superpoder escolhido seria:',['Voar','Invisibilidade','Ler mentes','Parar o tempo']],['Meu maior defeito é:',['Bagunça','Atraso','Teimosia','Ciúme bobo']],['O que mais me estressa?',['Trânsito','Barulho','Fila','Mensagem sem resposta']],['A música que mais combina comigo:',['Pop','Sertanejo','Rock','Funk ou rap']],['Eu prefiro acordar:',['Cedo','Meio-dia','Tarde','Depende do dia']],['Meu presente ideal:',['Uma experiência','Algo feito à mão','Tecnologia','Comida']],['Num filme eu escolho:',['Comédia','Terror','Romance','Ação']]];
function qmStart(){G={g:'qm',q:shuf(QMQ).slice(0,8),r:0,s:[0,0]};qmAsk()}
function qmAsk(){const q=G.q[G.r];reveal(G.r%2,`<p class="mu">Pergunta ${G.r+1}/8 · responda sobre VOCÊ</p><h3>${q[0]}</h3>`+q[1].map((o,k)=>ob(o,'qma',k)).join(''),null)}
GF.qma=k=>{G.a=+k;const q=G.q[G.r],g=1-G.r%2;reveal(g,`<p class="mu">Pergunta ${G.r+1}/8</p><h3>${q[0]}</h3><p>O que <b>${nm(1-g)}</b> respondeu?</p>`+q[1].map((o,j)=>ob(o,'qmg',j)).join(''),null)};
GF.qmg=k=>{const g=1-G.r%2,q=G.q[G.r],ok=+k===G.a;if(ok)G.s[g]++;G.r++;sc(`<div class="card center"><h2>${ok?'🎯 Acertou!':'😅 Errou!'}</h2><p>${nm(1-g)} respondeu: <b>${q[1][G.a]}</b><br>${nm(g)} chutou: <b>${q[1][+k]}</b></p></div>${scb(G.s)}`+bt(G.r>=G.q.length?'Ver resultado 💕':'Próxima ➡️','qmn'))};
GF.qmn=()=>{if(G.r<G.q.length)return qmAsk();const t=G.s[0]+G.s[1];fin(`<div class="center"><h1 class="pop">${t>=7?'💞 Almas gêmeas!':t>=5?'😍 Se conhecem muito bem':t>=3?'🙂 Dá pra se conhecer mais':'😂 Precisam conversar mais!'}</h1><p>${t} acertos de 8</p></div>${scb(G.s)}`,'qm')};
/* Sincronia */
const SYQ=[['Jantar romântico em casa 🕯️','Rolê de aventura 🧗'],['Viagem surpresa ✈️','Viagem planejada 📋'],['Dormir abraçados 🤗','Cada um no seu espaço 🛏️'],['Mensagem de bom dia ☀️','Mensagem de boa noite 🌙'],['Cozinhar juntos 🍳','Pedir delivery 🛵'],['Cinema 🍿','Sofá e série 🛋️'],['Praia 🏖️','Montanha ⛰️'],['Presente caro 🎁','Carta de amor ✉️'],['Cachorro 🐶','Gato 🐱'],['Café da manhã na cama 🥐','Jantar fora 🍝']];
function syStart(){G={g:'sy',q:shuf(SYQ),r:0,m:0,p:[]};syPick(0)}
function syPick(i){reveal(i,`<p class="mu">Rodada ${G.r+1}/${G.q.length} · escolha o que VOCÊ prefere. O objetivo é combinar com o outro!</p>`+G.q[G.r].map((o,k)=>ob(o,'syp',k)).join(''),null)}
GF.syp=k=>{G.p.push(+k);if(G.p.length<2)return syPick(1);const q=G.q[G.r],ok=G.p[0]===G.p[1],p=G.p;G.p=[];if(ok)G.m++;G.r++;
 sc(`<div class="card center"><h2>${ok?'💘 Sincronizados!':'🤷 Opiniões diferentes'}</h2><p>${nm(0)}: <b>${q[p[0]]}</b><br>${nm(1)}: <b>${q[p[1]]}</b></p></div><p class="center">Sincronia: <b>${G.m}</b> de ${G.r}</p>`+bt(G.r>=G.q.length?'Ver resultado 💕':'Próxima ➡️','syn'))};
GF.syn=()=>{if(G.r<G.q.length)return syPick(0);const pc=G.m*10;fin(`<div class="center"><div class="nota drop"><b>${pc}%</b><small>sincronia</small></div><h1 class="pop">${pc>=80?'💞 Mentes conectadas!':pc>=50?'😍 Boa sintonia':'😂 Os opostos se atraem!'}</h1><p>${G.m} de ${G.q.length} escolhas iguais</p></div>`,'sy')};
/* Cartas do Casal */
const CCD={Conversa:['💬',['Quando você percebeu que gostava de mim?','O que eu faço que mais faz você se sentir amado(a)?','O que você admira em mim?','Qual música lembra a gente?','Como você descreve nossa relação em 3 palavras?','O que você nunca me contou e gostaria de contar?']],Memórias:['📸',['Qual foi o nosso melhor encontro?','Qual foi sua primeira impressão de mim?','Qual foi o dia mais engraçado que vivemos?','Qual lugar que fomos você quer revisitar?','Qual foto nossa é sua favorita?']],Planos:['✨',['Onde você quer viajar comigo no próximo ano?','Como seria a nossa casa dos sonhos?','Qual meta podemos cumprir juntos este ano?','Qual hábito novo podemos criar a dois?','O que você quer que a gente nunca deixe de fazer?']],Carinho:['💗',['Deem um abraço de 20 segundos.','Diga 3 coisas que você ama no(a) parceiro(a).','Faça uma massagem de 1 minuto nos ombros.','Escreva um bilhete de amor agora.','Olhem nos olhos por 30 segundos sem rir.','Dê um beijo na testa e um elogio.']],Diversão:['🎈',['Imite o(a) parceiro(a) por 15 segundos.','Dancem juntos por 20 segundos.','Conte uma piada ruim e o outro dá nota.','Desenhem um ao outro em 30 segundos.','Digam o apelido mais bobo que já inventaram.']]};
function ccStart(){G={g:'cc',sel:new Set(['Conversa']),i:0,card:null,dk:{}};Object.entries(CCD).forEach(([k,v])=>G.dk[k]=deck(v[1]));cc()}
function cc(){sc(`<h2>💕 Cartas do Casal</h2>${cj()}<p class="mu">Escolha uma ou mais categorias:</p><div class="cats">${Object.keys(CCD).map(k=>`<button class="cat ${G.sel.has(k)?'on':''}" data-a="g" data-f="ccs" data-v="${k}"><i>${CCD[k][0]}</i><span>${k}</span>${G.sel.has(k)?'<b>✓</b>':''}</button>`).join('')}</div><div class="center"><p class="mu">Vez de</p><h1 class="pop">${nm(G.i%2)}</h1></div>${G.card?`<div class="card pop"><span class="chip" style="align-self:flex-start">${G.card.k}</span><h3>${esc(G.card.t)}</h3></div>${bt('Feito! Próxima ➡️','ccn','','mint')}${bt('Pular 🙅','ccp','','sec')}`:bt('Tirar uma carta 🃏','ccd','','coral')}`)}
GF.ccs=k=>{if(G.sel.has(k)){if(G.sel.size>1)G.sel.delete(k);else toast('Deixe pelo menos 1 categoria.')}else G.sel.add(k);G.card=null;cc()};
GF.ccd=()=>{const c=pk([...G.sel]);G.card={k:`${CCD[c][0]} ${c}`,t:G.dk[c]()};cc()};GF.ccn=()=>{G.i++;G.card=null;cc()};GF.ccp=()=>{G.card=null;cc()};
/* Noite de Date */
const DTS=[['🍽️ Comer',['Pizza em casa','Sushi','Hambúrguer artesanal','Massa caseira','Churrasquinho','Sorvete no parque','Café da tarde','Comida de rua']],['🎬 Programa',['Maratona de filmes','Piquenique','Jogo de tabuleiro','Passeio de bicicleta','Pôr do sol num mirante','Karaokê em casa','Cozinhar juntos','Visitar um lugar novo']],['✨ Toque especial',['Playlist feita por um de vocês','Carta de amor','Foto de casal','Dança na sala','Massagem','Sobremesa surpresa','Velas e luz baixa','Brinde com algo especial']]];
function dtStart(){G={g:'dt',s:DTS.map(d=>pk(d[1])),v:[1,1]};dt()}
function dt(){sc(`<h2>🌹 Noite de Date</h2>${cj()}<p class="mu">O app sorteou o seu date. Cada um tem <b>1 veto</b> para trocar uma ideia.</p>${DTS.map((d,k)=>`<div class="card"><span class="mu">${d[0]}</span><h3>${G.s[k]}</h3><div class="chips">${[0,1].filter(p=>G.v[p]).map(p=>`<button class="chip" data-a="g" data-f="dtv" data-v="${k}:${p}">🚫 ${nm(p)} veta</button>`).join('')}</div></div>`).join('')}${bt('Fechar o date ✅','dtf','','mint')}${bt('Sortear tudo de novo 🎲','dtr','','sec')}`)}
GF.dtv=v=>{const [k,p]=v.split(':').map(Number);G.v[p]=0;G.s[k]=pk(DTS[k][1].filter(x=>x!==G.s[k]));dt()};
GF.dtr=()=>{G.s=DTS.map(d=>pk(d[1]));dt()};
GF.dtf=()=>fin(`<div class="center"><h1 class="pop">🌹 Date marcado!</h1></div><div class="card">${DTS.map((d,k)=>`<p>${d[0]}: <b>${G.s[k]}</b></p>`).join('')}</div><p class="mu center">Aproveitem! 💕</p>`,'dt');

/* ---------- Registro dos modos ---------- */
Object.assign(MODES,{
 mf:{ic:'🔪',n:'Máfia',d:'Papéis secretos · 4+',c:'var(--coral)'},
 im:{ic:'🕵️',n:'Impostor',d:'Palavra secreta · 3+',c:'var(--mint)'},
 cs:{ic:'🗝️',n:'Código Secreto',d:'Pistas em times · 4+',c:'var(--sky)'},
 la:{ic:'🔨',n:'Leilão às Cegas',d:'Lances secretos',c:'var(--sun)'},
 sv:{ic:'🏕️',n:'Sobrevivência',d:'Decisões em grupo',c:'var(--mint)'},
 cp:{ic:'🃏',n:'Cartas de Poder',d:'Efeitos e batalha',c:'var(--vio)'},
 cr:{ic:'🏁',n:'Corrida de Perguntas',d:'Tabuleiro de quiz',c:'var(--org)'},
 hi:{ic:'📖',n:'História Interativa',d:'8 finais diferentes',c:'var(--sky)'},
 nj:{ic:'🥷',n:'Ninja Secreto',d:'Missões · 3+',c:'var(--coral)'},
 cq:{ic:'👑',n:'Conquista do Reino',d:'Estratégia no mapa',c:'var(--sun)'},
 qm:{ic:'💞',n:'Quanto você me conhece?',d:'Adivinhe o parceiro',c:'var(--coral)'},
 sy:{ic:'💘',n:'Sincronia',d:'Escolham iguais',c:'var(--vio)'},
 cc:{ic:'💕',n:'Cartas do Casal',d:'Conversa e carinho',c:'var(--org)'},
 dt:{ic:'🌹',n:'Noite de Date',d:'Sorteio com veto',c:'var(--mint)'}});
const NEW={mf:mfStart,im:imStart,cs:csStart,la:laStart,sv:svStart,cp:cpStart,cr:crStart,hi:hiStart,nj:njStart,cq:cqStart,qm:qmStart,sy:syStart,cc:ccStart,dt:dtStart},_sm=startMode;
/* ---------- Pergunta "quem vai jogar?" antes de cada jogo ---------- */
let ALL=null,PG={},LIM={mf:[4,8],im:[3,8],cs:[4,8],nj:[3,8],qm:[2,2],sy:[2,2],cc:[2,2],dt:[2,2]};
const unsub=()=>{if(ALL){players=ALL;ALL=null}};
const _ps=playersScreen;playersScreen=n=>{unsub();_ps(n)};
const _home=home;home=()=>{unsub();_home()};A.home=home;
function preGame(m){unsub();if(players.length<2)return playersScreen(m);
 if(!PG.M||PG.M.join('\u0001')!==players.join('\u0001'))PG.sel=new Set(players.map((_,i)=>i));
 PG.M=[...players];PG.m=m;pgScr()}
function pgScr(){const m=PG.m,M=MODES[m]||{ic:'💰',n:'Jogo dos 20 Reais'},[lo,hi]=LIM[m]||[2,8];cur='g_pre';
 show(`<div class="center"><div style="font-size:56px">${M.ic}</div><h2>${M.n}</h2></div><div class="card"><h3>Quem vai jogar? 👥</h3><p class="mu">Marque os nomes de quem vai participar desta partida.</p><div class="chips">${PG.M.map((p,i)=>`<button class="chip ${PG.sel.has(i)?'on':''}" style="font-size:16px;padding:10px 16px" data-a="g" data-f="pgt" data-v="${i}">${PG.sel.has(i)?'✓ ':''}${esc(p)}</button>`).join('')}</div><div class="card" style="padding:12px"><p><b>🎮 Jogadores selecionados (${PG.sel.size})</b></p><p>${PG.M.filter((_,i)=>PG.sel.has(i)).map(esc).join(' • ')||'Nenhum jogador selecionado ainda.'}</p></div></div>${bt('Começar 🚀','pgo')}<button class="btn sec" data-a="g" data-f="pge" data-v="${m}">Editar lista de jogadores</button><button class="btn sec" data-a="home">Voltar</button>`)}
GF.pgt=i=>{i=+i;PG.sel.has(i)?PG.sel.delete(i):PG.sel.add(i);pgScr()};
GF.pge=m=>playersScreen(m);
GF.pgo=()=>{const [lo,hi]=LIM[PG.m]||[2,8],n=PG.sel.size;if(n<lo||n>hi)return toast(lo===hi?`Escolha exatamente ${lo} jogadores.`:`Escolha de ${lo} a ${hi} jogadores.`);
 ALL=[...players];players=PG.M.filter((_,i)=>PG.sel.has(i));const m=PG.m;NEW[m]?NEW[m]():_sm(m)};
startMode=m=>preGame(m);
home();
</script>
